name: Kairo Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  kairo-java:
    name: Kairo Java 17, ArchUnit & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Architecture Boundary Tests (ArchUnit)
        working-directory: kairo
        run: gradle :tests:architecture-tests:test --no-daemon

      - name: Run Full Test Suite & JaCoCo Coverage
        working-directory: kairo
        run: gradle check jacocoTestReport --no-daemon

      - name: Static Guard — No Platform Imports in Neutral Modules
        working-directory: kairo
        run: |
          if grep -rnE "^import (android|androidx|javafx|javax\.swing|java\.awt|org\.lwjgl|org\.jetbrains\.skija|org\.reflections)\." \
            libraries/kairo-annotations libraries/kairo-core libraries/kairo-ir libraries/kairo-xml \
            libraries/kairo-css-parser libraries/kairo-style libraries/kairo-state libraries/kairo-events \
            libraries/kairo-lifecycle libraries/kairo-layout libraries/kairo-components-api \
            libraries/kairo-components-basic libraries/kairo-components-input libraries/kairo-components-form \
            libraries/kairo-components-list libraries/kairo-navigation libraries/kairo-async \
            libraries/kairo-resources libraries/kairo-renderer-api libraries/kairo-runtime \
            libraries/kairo-inspector libraries/kairo-testkit tools/kairo-cli examples/gallery; then
            echo "ERROR: Forbidden platform import detected in neutral module!"
            exit 1
          fi

  web-landing:
    name: Web Landing & Explorer (TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Production Vite build
        run: npm run build
